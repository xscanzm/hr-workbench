<body>
<div class="th-host" id="host-hq" hidden></div>
<template id="tpl-hq">
<link rel="stylesheet" href="css/hq.css?v=2">

<div class="app" id="app">
<canvas class="gl" id="gl" aria-label="智能总部：一座回字形单层办公楼的沙盘，正中是 Chief 的总经理办公室，四周 8 个部门，每个人是一个 Agent 或一位真人督办。点 Chief 新增任务，点人事部负责人管理成员，点部门或人物看进度；拖动旋转镜头，滚轮缩放，双击复位，Esc 返回"></canvas>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<div class="vig" aria-hidden="true"></div>
<div class="nr" id="nr">
<div class="fit"><div class="fit-in" id="fitIn">
 <div class="board ov" id="board">
  <div class="topfade"></div>
  <div class="botfade"></div>
  <div class="labels" id="labels"></div>
  <div class="tags" id="tags"></div>
  <div class="bubs" id="bubs"></div>
  <header class="hd">
   <div class="eb">数字员工 · AGENT HQ · 8 DEPARTMENTS</div>
   <h1><span id="hqCo">我的公司</span><span class="l1">数字员工<em>智能总部</em></span></h1>
   <div class="sub2">示例数据 · 本地模拟 · 未接模型 · <b id="clock">--:--:--</b></div>
  </header>
  <nav class="crumb pe" aria-label="视图导航">
   <div class="cr cr-ov"><span class="live-dot"></span><span class="big" id="crOn">20</span><b>人在忙</b><span>·</span><span class="big" id="crPj">6</span><b>个项目推进中</b><em id="crSub">OVERVIEW</em><button class="cb hi" type="button" data-act="task">＋ 新增任务</button><button class="cb" type="button" data-act="hr">人员管理</button></div>
   <div class="cr cr-dp cr-sel" id="crDp"><button class="cb" type="button" data-act="home">← 全景</button><span class="cr-n" id="crDn">01</span><b id="crDName">产品部</b><em id="crDEn">PRODUCT</em><span class="pc" id="crDp2">0%</span><button class="cb" type="button" data-act="prev" aria-label="上一个">‹</button><button class="cb" type="button" data-act="next" aria-label="下一个">›</button></div>
   <div class="cr cr-pj cr-sel" id="crPj2"><button class="cb" type="button" data-act="home">← 全景</button><span class="cr-n" id="crPn">P1</span><b id="crPName">项目</b><span class="pc" id="crPp">0%</span><button class="cb" type="button" data-act="prev" aria-label="上一个">‹</button><button class="cb" type="button" data-act="next" aria-label="下一个">›</button></div>
   <div class="cr cr-ps cr-sel" id="crPs"><button class="cb" type="button" data-act="back">← 返回</button><span id="crSt"></span><b id="crSName">成员</b><em id="crSRole">ROLE</em><button class="cb" type="button" data-act="prev" aria-label="上一个">‹</button><button class="cb" type="button" data-act="next" aria-label="下一个">›</button></div>
   <button class="tod" type="button" data-act="tod" aria-label="切换昼夜"><i id="todIc">☀</i><b id="todT">--:--</b><span id="todL">实时</span></button>
  </nav>
  <div class="tools pe">
   <button class="tb" type="button" data-act="mode">视角<b data-f="mode">全景</b></button>
   <a class="tb" href="../index.html">← 工作台</a>
   <button class="tb" type="button" data-act="full" data-f="full">全屏</button>
  </div>
  <div class="bgl">
   <div class="bk">公司总进度<em id="cPn">8 个项目加权</em></div>
   <div class="bv" id="cP">0<small>%</small></div>
   <div class="pseg" id="cPs"></div>
   <div class="bs">
    <div><b id="kDone">0</b><span>今日完成</span></div>
    <div><b id="kWip">0</b><span>进行中</span></div>
    <div id="kRevT"><b id="kRev">0</b><span>待真人审核</span></div>
    <div><b id="kLead">0<small>min</small></b><span>平均交付</span></div>
    <div><b id="kRw">0<small>%</small></b><span>返工率</span></div>
    <div><b id="kTok">0</b><span>今日 Token</span></div>
   </div>
  </div>
  <div class="bgr">
   <div class="bk">动态<em id="logMeta">ALL</em></div>
   <div class="log" id="log"></div>
  </div>

  <section class="dock">
   <div class="dk-h"><span class="dk-t"><b>部门进度</b>DEPARTMENTS</span><span class="sp"></span><span class="sbar" id="sel"></span><span class="vt" id="vt"><button type="button" data-v="ov" class="on">全景</button><button type="button" data-v="dp">部门</button><button type="button" data-v="pj">项目</button><button type="button" data-v="ps">人员</button></span><button class="cb" type="button" data-act="hr" id="btmHR">人员管理</button></div>
   <div class="dl" id="dl"></div>
   <div class="dk-h dk-h2"><span class="dk-t"><b id="btmT">项目进度</b><span id="btmE">PROJECTS</span></span><span class="sp"></span><span id="plMeta"></span></div>
   <div class="dk-b">
    <div class="vb vb-ov"><div class="pl" id="pl"></div></div>
    <div class="vb vb-dp"><div class="mtb" id="mtb"></div></div>
    <div class="vb vb-pj"><div class="ppl" id="ppl"></div></div>
    <div class="vb vb-ps"><div class="pfl" id="pfl"></div></div>
   </div>
  </section>

  <footer class="sb"><span class="wm">DEVELOPED BY 皮皮未来 · 周一</span></footer>
 </div>

 <div class="mini" id="mini">
  <div class="m-top">
   <div class="m-title"><span id="mCo">我的公司</span><i id="mSub">数字员工 · 智能总部</i></div>
   <div class="m-btns pe">
    <button class="tb m-back" type="button" data-act="home">← 全景</button>
    <button class="tb" type="button" data-act="task">＋任务</button>
    <button class="tb" type="button" data-act="hr">人员</button>
    <button class="tb" type="button" data-act="mode">视角<b data-f="mode">全景</b></button>
    <a class="tb" href="../index.html">← 工作台</a>
   </div>
  </div>
  <div class="m-bot">
   <div class="m-ch" id="mCh"></div>
   <div class="m-pj" id="mPj"></div>
   <div class="m-stats"><div><span id="mS1L">公司总进度</span><b id="mS1">0%</b></div><div><span id="mS2L">进行中</span><b id="mS2">0</b></div><div><span id="mS3L">今日完成</span><b id="mS3">0</b></div></div>
   <div class="m-wm">DEVELOPED BY 皮皮未来 · 周一</div>
  </div>
 </div>
</div></div>
</div>
<div class="mdl" id="mdlTask" hidden role="dialog" aria-modal="true" aria-labelledby="tkTitle">
 <div class="mdl-card">
  <div class="mdl-h"><div><b id="tkTitle">交给 <u>Chief</u> · 新增任务</b><span>Chief 会把任务拆成几项，按部门顺序一棒一棒派下去；带「审」的环节要负责人（真人督办或 Agent）放行。</span></div><button class="mdl-x" type="button" data-close aria-label="关闭">×</button></div>
  <div class="mdl-b">
   <label class="fld"><span>任务名称</span><input id="tkName" type="text" maxlength="20" placeholder="例如：新人引导体验优化" autocomplete="off"></label>
   <div class="fld"><span>任务类型</span><div class="chips" id="tkTpl"></div></div>
   <div class="fld" id="tkCustomF" hidden><span>自定义流程：点部门依次加入（最多 5 步），每步默认由负责人审核</span><div class="chips" id="tkDepts"></div></div>
   <div class="fld"><span>流转预览</span><div class="chain" id="tkChain"></div></div>
   <div class="row2">
    <label class="fld"><span>拆成几项<b id="tkNv">4</b></span><input id="tkN" type="range" min="2" max="8" value="4"></label>
    <div class="fld"><span>优先级</span><div class="seg" id="tkPri"><button type="button" data-v="0" class="on">普通</button><button type="button" data-v="1">加急 · 插队先派</button></div></div>
   </div>
   <div class="err" id="tkErr" hidden></div>
  </div>
  <div class="mdl-f"><button class="btn" type="button" data-close>取消</button><button class="btn pri" type="button" id="tkGo">交给 Chief</button></div>
 </div>
</div>
<div class="mdl" id="mdlHR" hidden role="dialog" aria-modal="true" aria-labelledby="hrTitle">
 <div class="mdl-card wide">
  <div class="mdl-h"><div><b id="hrTitle">人员管理 · <u>HR</u></b><span id="hrMeta">—</span></div><button class="mdl-x" type="button" data-close aria-label="关闭">×</button></div>
  <div class="mdl-b" id="hrList">
   <div class="hr-bar"><div class="chips" id="hrDept"></div><input id="hrQ" type="search" placeholder="搜索姓名 / 岗位 / 技能" autocomplete="off" aria-label="搜索成员"><button class="btn pri" type="button" id="hrAdd">＋ 新增成员</button></div>
   <div class="hr-tb" id="hrTb"></div>
  </div>
  <div class="mdl-b" id="hrForm" hidden>
   <div class="hf-grid">
    <label class="fld"><span>姓名</span><input id="hfName" type="text" maxlength="8" autocomplete="off" placeholder="两三个字，不能和现有成员重名"></label>
    <div class="fld"><span>类型</span><div class="seg" id="hfType"><button type="button" data-v="1" class="on">Agent</button><button type="button" data-v="0">真人督办</button></div></div>
    <label class="fld"><span>部门</span><select id="hfDept"></select></label>
    <label class="fld"><span>岗位</span><input id="hfRole" type="text" maxlength="14" autocomplete="off" placeholder="例如：前端 Agent"></label>
    <label class="fld"><span>技能（用顿号或逗号分隔）</span><input id="hfSk" type="text" maxlength="30" autocomplete="off" placeholder="例如：页面、小程序"></label>
    <label class="fld chk"><input id="hfHead" type="checkbox"><span>设为部门负责人</span></label>
    <div class="fld"><span>外观</span><div class="look"><i class="av" id="hfAv"></i><button class="btn sm" type="button" id="hfLook">换一套</button><em id="hfSeat">—</em></div></div>
   </div>
   <div class="err" id="hfErr" hidden></div>
  </div>
  <div class="mdl-f" id="hrFoot"><span class="note" id="hrNote">名单保存在本浏览器 · <button class="lnk" type="button" id="hrReset">恢复默认名单</button></span><button class="btn" type="button" data-close>完成</button></div>
  <div class="mdl-f" id="hfFoot" hidden><button class="btn" type="button" id="hfCancel">返回列表</button><button class="btn pri" type="button" id="hfSave">保存</button></div>
 </div>
</div>
<div class="toastx" id="toastx" hidden></div>
<div class="glfail" id="glFail" hidden>这台设备的浏览器没法显示 3D 总部（WebGL 不可用），面板数据和人员管理照常可用。换 Chrome / Edge 打开即可看到。</div>
</div>
</template>
